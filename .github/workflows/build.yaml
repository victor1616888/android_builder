name: Android Build
on:
  workflow_dispatch:
env:
  ACTIONS_RUNNER_FORCE_NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - id: get-project
        name: Get project name
        run: |
          set -e
          # 检查文件是否存在
          if [ ! -f "project-to-build" ]; then
            echo "ERROR: 文件 project-to-build 不存在！"
            exit 1
          fi
          PROJECT_CONTENT=$(cat project-to-build)
          echo "读取到仓库地址：$PROJECT_CONTENT"
          if [ -z "$PROJECT_CONTENT" ]; then
            echo "ERROR: project-to-build 文件为空！"
            exit 1
          fi
          echo "PROJECT=$PROJECT_CONTENT" >> $GITHUB_ENV

      - name: Clone target Android project
        run: |
          set -e
          echo "开始克隆仓库：${{ env.PROJECT }}"
          git clone --depth=1 ${{ env.PROJECT }} project
          echo "克隆完成"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('project/**/*.gradle*', 'project/gradle-wrapper.properties') }}

      - name: Build Debug APK
        working-directory: ./project
        run: |
          set -e
          if [ ! -f "gradlew" ]; then
            echo "未找到gradlew，生成wrapper"
            gradle wrapper
          fi
          chmod +x gradlew
          echo "开始编译 assembleDebug"
          ./gradlew assembleDebug --stacktrace

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: my-build-apk
          path: project/**/*.apk
