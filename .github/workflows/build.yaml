name: Android Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      # 修复distribution必填，JDK17安卓标准
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 修复废弃set-output语法，改用env环境变量
      - id: get-project
        name: Get project name
        run: echo "PROJECT=$(cat project-to-build)" >> $GITHUB_ENV

      - name: Clone target Android project
        run: git clone --depth=1 ${{ env.PROJECT }} project

      # Gradle缓存加速构建
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('project/**/*.gradle*', 'project/gradle-wrapper.properties') }}

      - name: Build Debug APK
        working-directory: ./project
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: my-build-apk
          path: project/**/*.apk
